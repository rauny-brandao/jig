# Example jig manifest using public tools. It covers every asset layout:
# zip and tar.gz archives (gh), raw binaries (jq), extra binaries (uv),
# gzip-compressed binaries (cs), and every built-in extra kind.
#
# Checksums are filled in by: go run ./cmd/jig-checksums -f examples/tools.yaml
tools:
  gh:
    version: "2.102.0"
    description: "GitHub CLI"
    platforms:
      darwin_arm64:
        url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_macOS_arm64.zip"
        archive_format: zip
        binary_name: gh
        binary_path: "gh_{version}_macOS_arm64/bin/gh"
        sha256: "da922c20d1792e5b2cbf375593d7a658acf034c12c84e007e71c76ef959c337e"
      darwin_amd64:
        url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_macOS_amd64.zip"
        archive_format: zip
        binary_name: gh
        binary_path: "gh_{version}_macOS_amd64/bin/gh"
        sha256: "b245f24eb2bf5f75b426b4c26da3651a107f8d5b6f4fddfbfccc5679041378b3"
      linux_amd64:
        url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_linux_amd64.tar.gz"
        archive_format: tar.gz
        binary_name: gh
        binary_path: "gh_{version}_linux_amd64/bin/gh"
        sha256: "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"
      linux_arm64:
        url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_linux_arm64.tar.gz"
        archive_format: tar.gz
        binary_name: gh
        binary_path: "gh_{version}_linux_arm64/bin/gh"
        sha256: "7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484"
      windows_amd64:
        url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_windows_amd64.zip"
