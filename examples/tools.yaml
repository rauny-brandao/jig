# Extras are installed through the tools above, after what they require.
extras:
  - kind: gh-extension
    name: branch
    repo: mislav/gh-branch
    requires: [gh]
  - kind: uv-tool
    name: cowsay
    source: "cowsay==6.1"
    requires: [uv]
  - kind: node-runtime
    name: node
    channel: lts-latest
    requires: [fnm]
  - kind: npm-global
    name: semver
    version: "7.8.5"
    requires: [node]
  - kind: jdk
    name: "temurin:25"
    requires: [cs]
