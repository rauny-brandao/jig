        binary_name: gh.exe
        binary_path: "bin/gh.exe"
        sha256: "ae64e556ecc240b200f7eba60d550e4bb60d78e860e69dd88c449405b86067f4"
    verify_command: ["gh", "version"]
    verify_pattern: "gh version {version}"
